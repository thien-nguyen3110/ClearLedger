name: verify
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.6', cache-dependency-path: apps/api/go.sum}
      - run: go test -race ./...
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/web
      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yaml config --quiet
        env:
          API_TOKEN: ci-only-configuration-token-123456
          POSTGRES_PASSWORD: ci-only-configuration-password
