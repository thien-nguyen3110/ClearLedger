name: clearledger
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: clearledger
      POSTGRES_DB: clearledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearledger"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic clearledger.reconciliation.v1 --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092"]
  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgres://clearledger:${POSTGRES_PASSWORD}@postgres:5432/clearledger?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN to at least 24 characters in .env}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    command: ["worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped
volumes:
  postgres-data:
  kafka-data:
  ollama-data:
